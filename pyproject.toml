[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsebench"
version = "0.1.0"
description = "Robust Skill Self-Evolution benchmark construction and pilot harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "huggingface-hub>=0.27",
  "httpx>=0.27",
  "openai>=1.50",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "Pillow>=10.4",
  "pyarrow>=17",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[project.scripts]
rsebench = "rsebench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
