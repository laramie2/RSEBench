schema_version: rsebench.experiment-matrix.v1
qualification_version: noise-screen-v1
candidate_index: 2
stage: clean
method_seeds: [20260813, 20260814, 20260815]
provider: deepseek
model: deepseek-v4-flash
temperature: 0.0
thinking: disabled
provider_config: configs/pilot/deepseek-v4-flash-4096.yaml
output_root: outputs/runs/noise-screen-v1-qualification
cells:
  - key: spreadsheet-candidate2-skillopt
    benchmark: spreadsheetbench_verified
    baseline: skillopt
    launcher: scripts/run_clean_skillopt.py
    manifest: benchmark/validation/noise_screen_v1/candidates/spreadsheetbench_verified/candidate_2.json
    manifest_candidate_index: 2
    seed_skill: methods://skillopt/skillopt/envs/spreadsheetbench/skills/initial.md
    seed_skill_argument: false
    task_counts: {train: 20, validation: 10, clean_test: 30}
    runtime:
      max_steps: 3
      batch_size: 7
      workers: 2
      max_tool_turns: 3
      max_completion_tokens: 2048
    adapter_key: skillopt
    adapter_max_parallel: 2
    mutable_resource_keys: []

  - key: officeqa-candidate2-skillopt
    benchmark: officeqa_full
    baseline: skillopt
    launcher: scripts/run_clean_skillopt.py
    manifest: benchmark/validation/noise_screen_v1/candidates/officeqa_full/candidate_2.json
    manifest_candidate_index: 2
    seed_skill: methods://skillopt/skillopt/envs/officeqa/skills/initial.md
    seed_skill_argument: false
    task_counts: {train: 12, validation: 12, clean_test: 20}
    runtime:
      max_steps: 3
      batch_size: 4
      workers: 2
      max_tool_turns: 12
      max_completion_tokens: 4096
    adapter_key: skillopt
    adapter_max_parallel: 2
    mutable_resource_keys: []

  - key: webshop-candidate2-skilladaptor
    benchmark: webshop
    baseline: skilladaptor
    launcher: scripts/run_clean_skilladaptor.py
    manifest: benchmark/validation/noise_screen_v1/candidates/webshop/candidate_2.json
    manifest_candidate_index: 2
    seed_skill: benchmark/core1/seeds/skilladaptor_webshop.json
    task_counts: {train: 5, validation: 5, clean_test: 20}
    runtime:
      max_iterations: 3
      max_episode_steps: 15
      min_sample_size: 5
    adapter_key: skilladaptor
    adapter_max_parallel: 1
    mutable_resource_keys: []

  - key: skilllearn-organize-messy-files
    benchmark: skilllearnbench
    baseline: skilllearn_self_feedback
    family: organize-messy-files
    launcher: scripts/run_clean_skilllearn.py
    manifest: benchmark/validation/noise_screen_v1/candidates/skilllearnbench/candidate_1.json
    manifest_candidate_index: 1
    seed_skill: benchmark/core1/seeds/skilllearn.md
    image_manifest: outputs/preflight/noise-screen-v1/skilllearn_image_manifest.json
    task_counts: {train: 2, validation: 1, clean_test: 0}
    runtime: &skilllearn_runtime
      evolution_rounds: 2
      max_completion_tokens: 4096
      max_tool_turns: 16
      require_prebuilt_images: true
    adapter_key: skilllearn
    adapter_max_parallel: 3
    mutable_resource_keys:
      - docker:skilllearn:organize-messy-files:{method_seed}

  - key: skilllearn-offer-letter-generator
    benchmark: skilllearnbench
    baseline: skilllearn_self_feedback
    family: offer-letter-generator
    launcher: scripts/run_clean_skilllearn.py
    manifest: benchmark/validation/noise_screen_v1/candidates/skilllearnbench/candidate_1.json
    manifest_candidate_index: 1
    seed_skill: benchmark/core1/seeds/skilllearn.md
    image_manifest: outputs/preflight/noise-screen-v1/skilllearn_image_manifest.json
    task_counts: {train: 2, validation: 1, clean_test: 0}
    runtime: *skilllearn_runtime
    adapter_key: skilllearn
    adapter_max_parallel: 3
    mutable_resource_keys:
      - docker:skilllearn:offer-letter-generator:{method_seed}

  - key: skilllearn-schedule-planning
    benchmark: skilllearnbench
    baseline: skilllearn_self_feedback
    family: schedule-planning
    launcher: scripts/run_clean_skilllearn.py
    manifest: benchmark/validation/noise_screen_v1/candidates/skilllearnbench/candidate_1.json
    manifest_candidate_index: 1
    seed_skill: benchmark/core1/seeds/skilllearn.md
    image_manifest: outputs/preflight/noise-screen-v1/skilllearn_image_manifest.json
    task_counts: {train: 2, validation: 1, clean_test: 0}
    runtime: *skilllearn_runtime
    adapter_key: skilllearn
    adapter_max_parallel: 3
    mutable_resource_keys:
      - docker:skilllearn:schedule-planning:{method_seed}

  - key: skilllearn-dependency-vulnerability-check
    benchmark: skilllearnbench
    baseline: skilllearn_self_feedback
    family: dependency-vulnerability-check
    launcher: scripts/run_clean_skilllearn.py
    manifest: benchmark/validation/noise_screen_v1/candidates/skilllearnbench/candidate_1.json
    manifest_candidate_index: 1
    seed_skill: benchmark/core1/seeds/skilllearn.md
    image_manifest: outputs/preflight/noise-screen-v1/skilllearn_image_manifest.json
    task_counts: {train: 2, validation: 1, clean_test: 0}
    runtime: *skilllearn_runtime
    adapter_key: skilllearn
    adapter_max_parallel: 3
    mutable_resource_keys:
      - docker:skilllearn:dependency-vulnerability-check:{method_seed}
