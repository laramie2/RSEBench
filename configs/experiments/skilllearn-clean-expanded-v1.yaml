    manifest: benchmark/validation/clean_qualification_v2/skilllearnbench/dependency-vulnerability-check.json
    seed_skill: benchmark/core1/seeds/skilllearn.md
    image_manifest: benchmark/validation/clean_qualification_v2/skilllearn_image_manifest.json
    task_counts: {train: 2, validation: 1, clean_test: 2}
    runtime: &skilllearn_runtime
      evolution_rounds: 2
      max_completion_tokens: 4096
      max_tool_turns: 16
      require_prebuilt_images: true
    adapter_key: skilllearn
    adapter_max_parallel: 3
