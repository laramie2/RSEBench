qualification_version: clean-qualification-v1
method_seeds: [20260813, 20260814, 20260815]
output_root: outputs/runs/clean-qualification-20260813
image_manifest: outputs/preflight/clean-qualification-v1/skilllearn/image_manifest.json
benchmarks:
  - benchmark: spreadsheetbench_verified
    launcher: scripts/run_clean_skillopt.py
    manifest: benchmark/validation/clean_qualification_v1/spreadsheetbench_verified.json
    seed_skill: methods://skillopt/skillopt/envs/spreadsheetbench/skills/initial.md
    sizes: {train: 20, validation: 10, clean_test: 30}
    budget: {max_steps: 3, batch_size: 7, workers: 2}
  - benchmark: officeqa_full
    launcher: scripts/run_clean_skillopt.py
    manifest: benchmark/validation/clean_qualification_v1/officeqa_full.json
    seed_skill: methods://skillopt/skillopt/envs/officeqa/skills/initial.md
    sizes: {train: 12, validation: 6, clean_test: 20}
    budget: {max_steps: 3, batch_size: 4, workers: 2}
  - benchmark: webshop
    launcher: scripts/run_clean_skilladaptor.py
    manifest: benchmark/validation/clean_qualification_v1/webshop.json
    seed_skill: benchmark/core1/seeds/skilladaptor_webshop.json
    sizes: {train: 5, validation: 5, clean_test: 20}
    budget: {max_iterations: 3, max_episode_steps: 15}
skilllearn:
  launcher: scripts/run_clean_skilllearn.py
  seed_skill: benchmark/core1/seeds/skilllearn.md
  sizes: {train: 2, validation: 1, clean_test: [2, 3]}
  budget: {evolution_rounds: 2, max_tool_turns: 16, max_completion_tokens: 4096}
  families:
    - organize-messy-files
    - offer-letter-generator
    - schedule-planning
    - dependency-vulnerability-check
    - github-repo-analytics
    - financial-analysis
    - stock-data-visualization
    - enterprise-information-search
